name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start agent and diagnose startup
        env:
          PORT: 3000
        run: |
          node server.js > /tmp/agent.log 2>&1 &
          pid=$!
          echo "Agent PID: $pid"
          for i in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:3000/health; then
              echo
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Agent exited before health check."
              cat /tmp/agent.log
              exit 1
            fi
            sleep 1
          done
          echo "Agent did not become healthy within 30 seconds."
          cat /tmp/agent.log
          exit 1
      - run: npm test
